name: Update Spigot version links

on:
  schedule:
    - cron: "30 */3 * * *"
  push:
    branches: [master]
    paths:
      - "spigot/**"
      - "requirements.txt"
      - ".github/workflows/spigot.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-spigot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spigot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Fetch latest Spigot version links
        run: python main.py

      - name: Lint & validate links
        run: python lib/validate.py spigot-versions.json

      - name: Upload updated data to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID_SPIGOT }}
        run: python lib/upload_gist.py

      - name: Commit updated JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spigot-versions.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update spigot/spigot-versions.json [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((attempt * 5))
          done
          exit 1
